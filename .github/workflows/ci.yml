name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.version }} (arm64) native build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            version: "15"
          - os: macos-26
            version: "26"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Mirrors README.md's "Building for macOS" recipe exactly, so this
      # job is a direct check that those documented steps still work.
      - name: Install dependencies
        run: brew install cmake ninja qt gstreamer yaml-cpp pkg-config ffmpeg jq

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build

      - name: Unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Functional RTSP smoke test
        run: ci/functional-smoke-test.sh build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QQCS_CI_ARTIFACT_DIR: /tmp/qqcs-ci

      - name: Upload smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqcs-screenshot-${{ matrix.os }}
          path: /tmp/qqcs-ci/screenshot.png
          if-no-files-found: warn

  linux:
    name: Ubuntu ${{ matrix.version }} (${{ matrix.arch }}) native build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            version: "26.04"
            arch: amd64
            cec: false
          # Same OS/build steps as the amd64 entry above -- the only
          # real differences are the architecture itself and CEC
          # (Raspberry Pi-relevant, off by default on amd64): no
          # separate cross-compile/emulation/Raspberry-Pi-specific
          # machinery is needed for this at all, GitHub's arm64-hosted
          # runners just run it natively. ubuntu-26.04-arm is still
          # marked "preview" by GitHub as of this writing, so
          # flakiness/queueing here could be the runner image itself
          # rather than this project's build.
          - os: ubuntu-26.04-arm
            version: "26.04"
            arch: arm64
            cec: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Only ubuntu-26.04 is covered (not older LTS releases): its apt
      # Qt6 (6.10.2) already clears this project's 6.8+ requirement, so
      # every entry in this matrix installs Qt straight from apt --
      # unlike 24.04 (6.4.2), no aqtinstall/install-qt-action detour is
      # needed anywhere here.
      - name: Update apt package lists
        run: sudo apt-get update

      # --no-install-recommends: without it, apt also pulls in a large
      # tree of Recommends (Qt doc/translation/GUI-designer tools,
      # Wayland/PipeWire, TensorFlow-Lite/ONNX runtime, extra codecs,
      # ...) that this headless build+smoke-test never uses.
      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends cmake ninja-build \
              qt6-base-dev qt6-declarative-dev qml6-module-qtquick qt6-tools-dev \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
              gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
              gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
              gstreamer1.0-libav libyaml-cpp-dev pkg-config ffmpeg jq

      - name: Install libCEC dependencies
        if: matrix.cec
        run: sudo apt-get install -y --no-install-recommends libcec-dev libp8-platform-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja ${{ matrix.cec && '-DQQCS_ENABLE_CEC=ON' || '' }}

      - name: Build
        run: cmake --build build

      - name: Unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Functional RTSP smoke test
        run: ci/functional-smoke-test.sh build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QQCS_CI_ARTIFACT_DIR: /tmp/qqcs-ci

      - name: Upload smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqcs-screenshot-${{ matrix.os }}
          path: /tmp/qqcs-ci/screenshot.png
          if-no-files-found: warn
